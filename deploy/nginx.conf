# ================================================================
# Nginx Configuration — MLM Admin VPS Deployment
# ================================================================
# Role: Reverse proxy that sits in front of Docker containers.
# All traffic hits Nginx first (ports 80/443).
# Nginx forwards everything to the Next.js frontend container.
# The Next.js server internally proxies /api/v1/* to the Go backend.
# This means ZERO CORS issues — same-origin for the entire app.
# ================================================================

# ---------- HTTP (initial IP-based access, no SSL) ----------
server {
    listen 80;
    server_name 200.141.8.27;  # ← Replace with your domain later

    # Max upload size (for potential admin uploads)
    client_max_body_size 50M;

    # Forward ALL requests to the Next.js frontend container
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass the original client info to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (needed for Next.js Hot Module Replacement in dev)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;
}

